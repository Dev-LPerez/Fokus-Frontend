<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 2: Focus Island (Ultra-Minimalist Center) — Fokus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Wix+Madefor+Display:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #edece9;
      font-family: 'DM Sans', sans-serif;
      color: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(28, 102, 98, 0.05) 0%, rgba(244, 224, 186, 0.2) 60%, transparent 100%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 1;
    }
    /* Minimalist Top Nav */
    nav {
      position: absolute; top: 0; left: 0; right: 0;
      height: 56px; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
    }
    .brand-mark {
      font-family: 'Wix Madefor Display', sans-serif;
      font-weight: 700; font-size: 14px; color: #1c6662;
      letter-spacing: -0.02em;
    }
    .nav-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .cal-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: #065f46; background: rgba(236, 253, 245, 0.9);
      border: 1px solid rgba(167, 243, 208, 0.8);
      padding: 4px 10px; border-radius: 20px;
    }

    /* Centered Island Container */
    .center-box {
      max-width: 680px; width: 100%;
      padding: 0 24px;
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 10;
    }
    .hero-title {
      font-family: 'Wix Madefor Display', sans-serif;
      font-size: 32px; font-weight: 700;
      letter-spacing: -0.03em;
      color: #0f172a;
      margin-bottom: 28px;
      text-align: center;
    }
    .hero-title span { color: #1c6662; }

    /* The Hero Input Box (starts in center, glides to bottom upon chat) */
    .hero-input-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      border-radius: 24px;
      padding: 16px 20px;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(28, 102, 98, 0.05);
      display: flex; flex-direction: column; gap: 14px;
    }
    .textarea-mock {
      width: 100%; border: none; outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: #0f172a; resize: none; min-height: 48px;
    }
    .textarea-mock::placeholder { color: #94a3b8; }
    .bottom-row {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(241, 245, 249, 0.8);
      padding-top: 12px;
    }
    .quick-prompts {
      display: flex; gap: 8px;
    }
    .mini-pill {
      background: #f8fafc; border: 1px solid #e2e8f0;
      color: #475569; font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 12px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .mini-pill:hover { background: #f1f5f9; color: #1c6662; border-color: rgba(28, 102, 98, 0.3); }
    .submit-button {
      width: 34px; height: 34px; border-radius: 17px;
      background: #1c6662; color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    .submit-button:hover { background: #154f4c; }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <nav>
    <div class="brand-mark">Fokus</div>
    <div class="nav-actions">
      <span class="cal-chip">● Google Calendar</span>
    </div>
  </nav>

  <div class="center-box">
    <h1 class="hero-title">
      ¿En qué nos <span>enfocamos</span> hoy, Luis?
    </h1>

    <div class="hero-input-card">
      <textarea class="textarea-mock" placeholder="Pide a tu copiloto organizar tu día, auditar tu agenda o blindar 90m de foco..."></textarea>
      <div class="bottom-row">
        <div class="quick-prompts">
          <button class="mini-pill">⚡ 90m Deep Work</button>
          <button class="mini-pill">📅 Auditar Agenda</button>
          <button class="mini-pill">📋 Eisenhower</button>
        </div>
        <button class="submit-button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
