<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 1: Zen Pure Canvas — Fokus Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Wix+Madefor+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #edece9;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
    .glow-teal {
      position: absolute; top: -100px; left: 15%; width: 500px; height: 500px;
      background: rgba(28, 102, 98, 0.04); border-radius: 50%; filter: blur(90px); pointer-events: none;
    }
    .glow-amber {
      position: absolute; bottom: 0; right: 10%; width: 450px; height: 450px;
      background: rgba(244, 224, 186, 0.35); border-radius: 50%; filter: blur(100px); pointer-events: none;
    }
    /* Single clean top header */
    header {
      height: 60px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
      position: sticky; top: 0; z-index: 20;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Wix Madefor Display', sans-serif;
      font-weight: 700; font-size: 15px; color: #0f172a;
    }
    .brand-mark {
      width: 24px; height: 24px; border-radius: 8px;
      background: rgba(28, 102, 98, 0.08); border: 1px solid rgba(28, 102, 98, 0.2);
      display: flex; align-items: center; justify-content: center;
      color: #1c6662; font-size: 11px; font-weight: 800;
    }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: #ecfdf5; border: 1px solid rgba(167, 243, 208, 0.8);
      padding: 4px 10px; border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #065f46;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    .btn-new {
      display: flex; align-items: center; gap: 6px;
      background: #ffffff; border: 1px solid rgba(229, 231, 235, 0.9);
      padding: 6px 14px; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #334155;
      cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: all 0.15s ease;
    }
    .btn-new:hover { background: #f8fafc; color: #1c6662; border-color: rgba(28, 102, 98, 0.3); }

    /* Center pure canvas */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 50px 24px 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative; z-index: 10;
    }
    .greeting-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 6px 16px; border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #64748b;
      margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .greeting-title {
      font-family: 'Wix Madefor Display', sans-serif;
      font-weight: 700;
      font-size: 38px;
      color: #0f172a;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .greeting-accent {
      color: #1c6662;
    }
    .greeting-sub {
      margin-top: 14px;
      font-size: 14px;
      color: #64748b;
      max-width: 460px;
      line-height: 1.6;
    }

    /* Subtle clean prompt chips */
    .chips-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .chip {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(229, 231, 235, 0.85);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .chip:hover {
      background: #ffffff;
      border-color: rgba(28, 102, 98, 0.35);
      color: #1c6662;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(28, 102, 98, 0.08);
    }
    .chip-sparkle { color: #1c6662; font-size: 13px; }

    /* Floating input bar */
    .input-dock {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 780px;
      padding: 0 24px;
      z-index: 30;
    }
    .input-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 10px 14px 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(28, 102, 98, 0.06);
    }
    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #0f172a;
    }
    .input-field::placeholder { color: #94a3b8; }
    .send-btn {
      width: 40px; height: 40px; border-radius: 20px;
      background: #1c6662; border: none;
      color: #ffffff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    .send-btn:hover { background: #154f4c; transform: scale(1.04); }
  </style>
</head>
<body>
  <div class="glow-teal"></div>
  <div class="glow-amber"></div>

  <!-- Single Unified Header -->
  <header>
    <div class="brand">
      <div class="brand-mark">F</div>
      <span>Fokus Copilot</span>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Google Calendar Conectado</span>
      </div>
      <button class="btn-new">+ Nueva Sesión</button>
    </div>
  </header>

  <!-- Clean Zen Main Canvas -->
  <main>
    <div class="greeting-pill">
      <span>☀️ Cereté, 29°C · Sin reuniones pendientes hoy</span>
    </div>

    <h1 class="greeting-title">
      Buenos días, Luis<br>
      ¿En qué protegemos tu <span class="greeting-accent">enfoque</span> hoy?
    </h1>

    <p class="greeting-sub">
      Organiza tu agenda, blinda bloques de trabajo profundo y avanza en tus prioridades con serenidad.
    </p>

    <!-- 3 Subtle Suggested Chips (No giant redundant cards) -->
    <div class="chips-strip">
      <button class="chip">
        <span class="chip-sparkle">✦</span>
        <span>Blindar 90m Deep Work</span>
      </button>
      <button class="chip">
        <span class="chip-sparkle">✦</span>
        <span>Auditar huecos en mi agenda</span>
      </button>
      <button class="chip">
        <span class="chip-sparkle">✦</span>
        <span>Priorizar con Matriz Eisenhower</span>
      </button>
    </div>
  </main>

  <!-- Clean Floating Input Island -->
  <div class="input-dock">
    <div class="input-card">
      <input type="text" class="input-field" placeholder="Escribe a Fokus o pide organizar tu jornada..." autofocus />
      <button class="send-btn" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
  </div>
</body>
</html>
