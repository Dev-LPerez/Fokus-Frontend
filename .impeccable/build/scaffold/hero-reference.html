<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-3.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#edece9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-nav-header region chrome" data-region="nav-header"><!-- frosted glass navigation bar container --></div>
  <div class="r-nav-logo region control" data-region="nav-logo"><!-- Fokus brand logo with focus mark: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-logo); a control need not have button chrome --></div>
  <div class="r-nav-menu region control" data-region="nav-menu"><!-- navigation links for method, ecosystem and pricing: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-menu); a control need not have button chrome --></div>
  <div class="r-nav-signin region control" data-region="nav-signin"><!-- Sign in button pill: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-signin); a control need not have button chrome --></div>
  <div class="r-eyebrow-badge region control" data-region="eyebrow-badge"><!-- SISTEMA DE HÁBITOS & FOCO pill badge: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop eyebrow-badge); a control need not have button chrome --></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- lead headline Tu jornada blindada, de la mañana a la noche --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-subhead region text" data-region="hero-subhead"><!-- subheading Avanza cada día con claridad. Consolida hábitos sostenibles y protege tus bloques de enfoque sin agotamiento --><p style="font-size:var(--r-hero-subhead-font);line-height:1.05;margin:0">hero-subhead</p></div>
  <div class="r-cta-google region control" data-region="cta-google"><!-- Empezar gratis con Google primary teal CTA button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-google); a control need not have button chrome --></div>
  <div class="r-stepper-briefing region control" data-region="stepper-briefing"><!-- 08:00 AM Daily Briefing & Clima tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop stepper-briefing); a control need not have button chrome --></div>
  <div class="r-stepper-deepwork region control" data-region="stepper-deepwork"><!-- 10:30 AM Bloque Deep Work 90 min Blindados active amber glowing tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop stepper-deepwork); a control need not have button chrome --></div>
  <div class="r-stepper-eisenhower region control" data-region="stepper-eisenhower"><!-- 04:00 PM Matriz Eisenhower tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop stepper-eisenhower); a control need not have button chrome --></div>
  <div class="r-deepwork-card region chrome" data-region="deepwork-card"><!-- frosted liquid glass card container for active deep work session --></div>
  <div class="r-countdown-timer region control" data-region="countdown-timer"><!-- circular progress ring with 01:14:20 timer display: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop countdown-timer); a control need not have button chrome --></div>
  <div class="r-card-status-badge region control" data-region="card-status-badge"><!-- Google Calendar Sincronizado status pill: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop card-status-badge); a control need not have button chrome --></div>
</main>
</body>
</html>
